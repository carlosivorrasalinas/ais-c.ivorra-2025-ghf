name: Build and Deploy to Azure

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Run Unit Tests
        run: mvn test -Dtest=es.codeurjc.web.nitflex.unit.**

      - name: Run Integration Tests
        run: mvn test -Dtest=es.codeurjc.web.nitflex.integration.**

      - name: Run System Tests
        run: mvn test -Dtest=es.codeurjc.web.nitflex.e2e.web.**

      - name: Package application
        run: mvn package -DskipTests

      - name: Extract version from pom.xml
        id: extract_version
        run: echo "VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)" >> $GITHUB_ENV

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        run: docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/nitflex:${{ env.VERSION }} .

      - name: Push Docker image
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/nitflex:${{ env.VERSION }}

      - name: Tag and push as latest
        run: |
          docker tag ${{ secrets.DOCKERHUB_USERNAME }}/nitflex:${{ env.VERSION }} ${{ secrets.DOCKERHUB_USERNAME }}/nitflex:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/nitflex:latest

      - name: Wait for Azure deployment to update
        run: sleep 60  # Da tiempo a que Azure use la nueva imagen

      - name: Run Smoke Test
        run: mvn test -Dtest=es.codeurjc.web.nitflex.smoke.SmokeTest -Dhost=https://${{ secrets.AZURE_WEBAPP_NAME }}.azurewebsites.net
