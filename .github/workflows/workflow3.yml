name: Build and Deploy to Azure upload docker

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Package application
        run: mvn package -DskipTests

      - name: Extract version from pom.xml
        id: extract_version
        run: echo "VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)" >> $GITHUB_ENV

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        run: docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/nitflex:${{ env.VERSION }} .

      - name: Push Docker image
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/nitflex:${{ env.VERSION }}

      - name: Tag and push as latest
        run: |
          docker tag ${{ secrets.DOCKERHUB_USERNAME }}/nitflex:${{ env.VERSION }} ${{ secrets.DOCKERHUB_USERNAME }}/nitflex:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/nitflex:latest

      - name: Wait for Azure deployment to update
        run: sleep 60

      - name: Run Smoke Test
        run: mvn test -Dtest=es.codeurjc.web.nitflex.smoke.SmokeTest -Dhost=https://netflix-azure123-d9fyepg0hba0a5fb.westeurope-01.azurewebsites.net
